name: CI

# Runs on every PR and on pushes to main. `check` is the fast gate;
# `integration-e2e` boots a throwaway local Supabase stack so the DB-backed
# layers run with real Postgres, RLS, views and triggers — no cloud, no secrets.
# See docs/testing-protocol.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Blocking gate. `pnpm lint` runs `eslint --max-warnings 0`, so any new
      # warning (not just errors) fails the build — the cleanup that brought
      # this to zero is locked in by the ratchet, no warning-drift.
      - name: Lint
        run: pnpm lint

      # Unit layer only — server-action + view tests need the DB and run in
      # the integration-e2e job. `--coverage` enforces the regression-ratchet
      # thresholds defined in vitest.config.ts; updating them is a deliberate
      # change in a PR, not a default behaviour.
      - name: Unit tests + coverage
        run: pnpm test --coverage

      # Persist the HTML report so a failing threshold is debuggable from the
      # CI run page — open the artifact and the per-file table tells you which
      # module regressed. Path matches vitest.config.ts `coverage` (default
      # `./coverage`).
      - name: Upload unit coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration-e2e:
    name: integration · e2e
    runs-on: ubuntu-latest
    # supabase start (cold Docker image pulls, ~2-3 min) + next build dominate
    # the wall time; give generous headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          # Pinned so `supabase status -o json` has a deterministic schema —
          # the export step below depends on its .API_URL / .SECRET_KEY /
          # .PUBLISHABLE_KEY keys. Bump deliberately.
          version: 2.95.4

      - run: pnpm install --frozen-lockfile

      # Boots Postgres + GoTrue + PostgREST in Docker and applies every
      # supabase/migrations/*.sql followed by supabase/seed.sql. Runs
      # synchronously — it must finish before any test step.
      - name: Start Supabase
        run: supabase start

      # Surface the local stack's URL + keys under the names the test harness
      # reads (scripts/test-int.sh, scripts/test-e2e.sh, playwright.config.ts).
      # Written to $GITHUB_ENV — `export` would not survive to later steps.
      - name: Export Supabase test env
        run: |
          STATUS="$(supabase status -o json)"
          # `jq -e` fails this step if a key is missing/null, rather than
          # exporting an empty value that breaks tests confusingly later.
          URL="$(echo "$STATUS" | jq -er '.API_URL')"
          SERVICE_KEY="$(echo "$STATUS" | jq -er '.SECRET_KEY')"
          ANON_KEY="$(echo "$STATUS" | jq -er '.PUBLISHABLE_KEY')"
          {
            echo "SUPABASE_TEST_URL=$URL"
            echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_KEY"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Integration tests + coverage
        run: pnpm test:int --coverage

      # Persist the HTML report — vitest.integration.config.ts writes to
      # `coverage-int/` so it doesn't clobber the unit run's `coverage/`.
      - name: Upload integration coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int
          path: coverage-int/
          retention-days: 7
          if-no-files-found: ignore

      # E2E runs against a prebuilt production server: playwright.config.ts
      # uses `next start` when CI is set (steadier than on-demand `next dev`
      # compilation under test load). NEXT_PUBLIC_* are baked in here.
      - name: Build app
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Blocking gate. The settings user-management specs that were failing
      # under the pre-refactor flat-button selectors were updated to drive the
      # OverflowMenu dropdown instead — see auth-users.spec.ts; the cause was
      # never a /settings listing bug, just selector drift. The deferred
      # endings-frameworks.spec.ts stays `test.skip` until the unified
      # ending_documents schema rewrite (Step 6 of endings-logic-v2-plan.md).
      - name: E2E tests
        run: pnpm test:e2e

      # Screenshots from failing specs (Playwright's default outputDir).
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
