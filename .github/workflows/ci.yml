name: CI

# Runs on every PR and on pushes to main. `check` is the fast gate;
# `integration-e2e` boots a throwaway local Supabase stack so the DB-backed
# layers run with real Postgres, RLS, views and triggers — no cloud, no secrets.
# See docs/testing-protocol.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Advisory: the suite carries pre-existing lint debt (~49 errors, mostly
      # react-hooks rules surfaced by the Next 16 upgrade). Reported on every
      # run but non-blocking until the debt is burned down — then drop
      # `continue-on-error` to make it a hard gate.
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true

      # Unit layer only — server-action + view tests need the DB and run in
      # the integration-e2e job. Coverage reporting is added in a later phase
      # once @vitest/coverage-v8 is a dependency.
      - name: Unit tests
        run: pnpm test

  integration-e2e:
    name: integration · e2e
    runs-on: ubuntu-latest
    # supabase start (cold Docker image pulls, ~2-3 min) + next build dominate
    # the wall time; give generous headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      # Boots Postgres + GoTrue + PostgREST in Docker and applies every
      # supabase/migrations/*.sql followed by supabase/seed.sql. Runs
      # synchronously — it must finish before any test step.
      - name: Start Supabase
        run: supabase start

      # Surface the local stack's URL + keys under the names the test harness
      # reads (scripts/test-int.sh, scripts/test-e2e.sh, playwright.config.ts).
      # Written to $GITHUB_ENV — `export` would not survive to later steps.
      - name: Export Supabase test env
        run: |
          STATUS="$(supabase status -o json)"
          {
            echo "SUPABASE_TEST_URL=$(echo "$STATUS" | jq -r '.API_URL')"
            echo "SUPABASE_TEST_SERVICE_KEY=$(echo "$STATUS" | jq -r '.SECRET_KEY')"
            echo "SUPABASE_TEST_ANON_KEY=$(echo "$STATUS" | jq -r '.PUBLISHABLE_KEY')"
          } >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:int

      # E2E runs against a prebuilt production server: playwright.config.ts
      # uses `next start` when CI is set (steadier than on-demand `next dev`
      # compilation under test load). NEXT_PUBLIC_* are baked in here.
      - name: Build app
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Advisory: 3 settings user-management specs in auth-users.spec.ts
      # have pre-existing failures (a created user never shows in the
      # /settings list). Reported on every run but non-blocking until the
      # debt is burned down — then drop `continue-on-error` to make it gate.
      - name: E2E tests (advisory)
        run: pnpm test:e2e
        continue-on-error: true

      # Screenshots from failing specs (Playwright's default outputDir).
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
